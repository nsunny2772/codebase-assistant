# Development or restricted staging with an external Neo4j database.
# Set credentials in backend/.env before starting. No repository code is executed.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_ORIGIN: http://127.0.0.1:8080
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1g
    cpus: 1.0
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [node, backend/dist/worker.js]
    env_file: backend/.env
    environment:
      HOST: 127.0.0.1
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 1.0
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: [127.0.0.1:8080:8080]
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 256m
